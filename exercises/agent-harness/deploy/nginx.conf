# The harness listens on 127.0.0.1 and is reached through nginx.
#
# Two things matter here and both are about not putting the service on the
# internet by accident:
#
#   1. The upstream is 127.0.0.1, so the port is never published.
#   2. The client body is capped, because the only thing this service
#      accepts is a small JSON object, and a body that big is not that.

upstream agent_harness {
    server 127.0.0.1:8010;
    keepalive 8;
}

server {
    listen 80;
    server_name harness.example.com;

    # Everything except /health needs a token. The token is checked by the
    # service, not here; this block only limits what may reach it.
    client_max_body_size 256k;

    location / {
        proxy_pass http://agent_harness;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The trace id is the harness's own id. If the caller sent one, it
        # is reused so the caller can correlate; if not, the service makes
        # one and returns it in the response header.
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://agent_harness;
        access_log off;
    }
}
