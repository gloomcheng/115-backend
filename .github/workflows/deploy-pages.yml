name: Deploy course to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Enforce repository secret policy
        run: node scripts/secret-harness.mjs --all
      # gitleaks-action v3 takes no inputs and always fetches its own pinned
      # gitleaks (8.24.3), which predates the [[allowlists]] config syntax that
      # .gitleaks.toml uses. So the binary is installed here with both the
      # version and its published sha256 pinned: the scanner version becomes
      # explicit, and the tarball is verified before anything runs.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: v8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          # The release tag carries a leading "v"; the asset name does not.
          archive="gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          curl -sSfL --retry 3 --proto '=https' --tlsv1.2 \
            -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan Git history with Gitleaks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gitleaks detect \
            --redact \
            -v \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=results.sarif

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            examples/http-api/requirements.txt
            examples/http-api/requirements-dev.txt
      - name: Install API test dependencies
        working-directory: examples/http-api
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run API tests
        working-directory: examples/http-api
        run: pytest -q

  deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check deployment boundaries
        run: node scripts/deployment-harness.mjs
      - name: Validate Docker Compose
        run: docker compose -f examples/http-api/compose.yaml config
      - name: Build the production image
        run: docker build --target runtime examples/http-api

  course-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install course dependencies
        run: bun install --frozen-lockfile
      - name: Run the complete course harness
        run: bun run check

  build:
    needs: [security, api-tests, deployment-contract, course-harness]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build and upload Astro site
        uses: withastro/action@v6
        with:
          package-manager: bun@1.4.0

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
