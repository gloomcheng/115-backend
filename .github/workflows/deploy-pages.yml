name: Deploy course to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Enforce repository secret policy
        run: node scripts/secret-harness.mjs --all
      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            examples/http-api/requirements.txt
            examples/http-api/requirements-dev.txt
      - name: Install API test dependencies
        working-directory: examples/http-api
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run API tests
        working-directory: examples/http-api
        run: pytest -q

  deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check deployment boundaries
        run: node scripts/deployment-harness.mjs
      - name: Validate Docker Compose
        run: docker compose -f examples/http-api/compose.yaml config
      - name: Build the production image
        run: docker build --target runtime examples/http-api

  course-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install course dependencies
        run: bun install --frozen-lockfile
      - name: Run the complete course harness
        run: bun run check

  build:
    needs: [security, api-tests, deployment-contract, course-harness]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build and upload Astro site
        uses: withastro/action@v6
        with:
          package-manager: bun@1.4.0

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
